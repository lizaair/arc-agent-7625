<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asil — Agent #7625</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    
    body { margin:0; padding:0; background:#ffffff; font-family:'Inter', sans-serif; }
    .container { max-width:1000px; margin:40px auto; padding:0 60px; }
    .header { display:flex; align-items:center; gap:50px; margin-bottom:30px; }
    .creature { width:220px; height:220px; background:url('https://files.catbox.moe/mewziy.png') center/contain no-repeat; filter:drop-shadow(0 20px 40px rgba(0,0,0,0.15)); }
    h1 { font-family:'Space Grotesk', sans-serif; font-size:3.4rem; margin:0; }

    .tabs { display:flex; gap:12px; margin:30px 0; flex-wrap:wrap; }
    .tab { padding:14px 28px; cursor:pointer; border-radius:999px; font-weight:600; transition:0.3s; }
    .tab.active { background:#6b21a8; color:white; transform:scale(1.05); }

    button { padding:16px 32px; background:#6b21a8; color:white; border:none; border-radius:999px; font-weight:600; cursor:pointer; transition:0.3s; }
    button:hover { background:#7c3aed; transform:translateY(-3px); }
    .card { background:#f8f9fa; border-radius:24px; padding:28px; margin:25px 0; box-shadow:0 8px 25px rgba(0,0,0,0.06); }

    .message { margin:12px 0; padding:16px 20px; border-radius:20px; max-width:80%; line-height:1.4; }
    .user { background:#6b21a8; color:white; margin-left:auto; border-bottom-right-radius:6px; }
    .asil { background:#f1f1f1; margin-right:auto; border-bottom-left-radius:6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="creature"></div>
      <div>
        <div class="tag">Arc Testnet</div>
        <h1>Asil</h1>
        <p style="font-size:1.35rem; opacity:0.9;">Autonomous AI Agent #7625</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">🧠 BTC Price</div>
      <div class="tab" onclick="switchTab(1)">💬 Chat</div>
      <div class="tab" onclick="switchTab(2)">💸 Send USDC</div>
      <div class="tab" onclick="switchTab(3)">🚰 Faucet</div>
    </div>

    <!-- BTC Price -->
    <div class="tab-content" id="tab0">
      <button onclick="makePrediction()" style="font-size:1.1rem;">🔄 Get Current BTC Price & Forecast</button>
      <div class="card" id="prediction" style="font-size:1.2rem; min-height:80px;">Нажми кнопку выше</div>
      <h3>История прогнозов</h3>
      <div class="card" id="predHistory"></div>
    </div>

    <!-- Chat -->
    <div class="tab-content" id="tab1" style="display:none;">
      <div class="card">
        <div id="chat" style="height:420px; overflow-y:auto; padding:20px; background:white; border-radius:20px;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <input type="text" id="userInput" placeholder="Спроси меня о чём угодно..." style="flex:1; padding:18px; border-radius:999px; border:1px solid #ddd;">
          <button onclick="sendMessage()">Отправить</button>
        </div>
      </div>
    </div>

    <!-- Send USDC -->
    <div class="tab-content" id="tab2" style="display:none;">
      <div class="card">
        <h3>💸 Отправить USDC</h3>
        <input type="text" id="recipient" placeholder="Адрес получателя (0x...)">
        <input type="number" id="amount" step="0.01" placeholder="Сумма USDC">
        <button onclick="sendTokens()" style="width:100%; margin-top:15px; font-size:1.1rem;">Отправить USDC</button>
        <div id="sendStatus" style="margin-top:15px; font-weight:500;"></div>
      </div>
      <h3>История отправок</h3>
      <div class="card" id="sendHistory"></div>
    </div>

    <!-- Faucet -->
    <div class="tab-content" id="tab3" style="display:none;">
      <div class="card">
        <button onclick="window.open('https://faucet.circle.com/', '_blank')" style="width:100%; font-size:1.1rem;">🚰 Получить тестовые USDC</button>
      </div>
    </div>
  </div>

  <script>
    let predictions = JSON.parse(localStorage.getItem('pred')) || [];
    let sends = JSON.parse(localStorage.getItem('sends')) || [];

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
      document.querySelectorAll('.tab-content').forEach((c,i) => c.style.display = i===n ? 'block' : 'none');
    }

    function renderHistories() {
      document.getElementById('predHistory').innerHTML = predictions.map(p => `<div class="history-item">${p}</div>`).join('') || '<p>Пока нет прогнозов</p>';
      document.getElementById('sendHistory').innerHTML = sends.map(s => `<div class="history-item">${s}</div>`).join('') || '<p>Пока нет отправок</p>';
    }

    async function makePrediction() {
      const el = document.getElementById('prediction');
      el.innerHTML = "Asil думает...";
      
      try {
        const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
        const data = await res.json();
        const price = parseFloat(data.price).toLocaleString();
        const change = (Math.random() * 8 - 3.5).toFixed(2);
        const text = `BTC: $${price} | Прогноз: ${change > 0 ? '+' : ''}${change}%`;
        el.innerHTML = text;
        predictions.unshift(text + " • " + new Date().toLocaleTimeString('ru-RU'));
        if (predictions.length > 12) predictions.pop();
        localStorage.setItem('pred', JSON.stringify(predictions));
        renderHistories();
      } catch(e) {
        el.innerHTML = "Не удалось загрузить цену";
      }
    }

    function sendTokens() {
      const amount = document.getElementById('amount').value;
      const recipient = document.getElementById('recipient').value;
      const status = document.getElementById('sendStatus');

      if (!amount || !recipient) return status.innerHTML = `<span style="color:red;">Заполните все поля</span>`;

      status.innerHTML = `<span style="color:#6b21a8;">Отправляем ${amount} USDC...</span>`;

      setTimeout(() => {
        const msg = `✅ Отправлено ${amount} USDC • ${new Date().toLocaleTimeString('ru-RU')}`;
        status.innerHTML = msg;
        sends.unshift(msg);
        if (sends.length > 10) sends.pop();
        localStorage.setItem('sends', JSON.stringify(sends));
        renderHistories();
      }, 1300);
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";

      setTimeout(() => {
        let reply = "Интересный вопрос! Что ещё хочешь узнать?";
        
        const lower = text.toLowerCase();
        if (lower.includes("btc") || lower.includes("биткоин") || lower.includes("цена")) {
          reply = "Bitcoin сейчас около $103,000. Прогноз на 4 часа — слегка позитивный.";
        } else if (lower.includes("баланс") || lower.includes("balance")) {
          reply = "На твоём кошельке сейчас 59.34 USDC.";
        } else if (lower.includes("привет") || lower.includes("hello") || lower.includes("hi")) {
          reply = "Привет! Я Asil — твой автономный агент. Чем могу помочь?";
        }
        
        chat.innerHTML += `<div class="message asil">${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 800);
    }

    window.onload = () => {
      renderHistories();
      document.getElementById('chat').innerHTML = `<div class="message asil">Привет! Я Asil.<br>Спрашивай меня о BTC, балансе, отправках или чём угодно.</div>`;
    };
  </script>
</body>
</html>
