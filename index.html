<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asil</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #f0f0f0; }
    .box { background: white; padding: 30px; border-radius: 15px; max-width: 600px; margin: auto; }
    input, button { padding: 12px; margin: 10px 0; width: 100%; font-size: 16px; }
    button { background: purple; color: white; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Asil Agent</h1>
    <p>Send USDC</p>
    <input type="text" id="addr" placeholder="0x... адрес получателя" />
    <input type="number" id="sum" placeholder="Сумма" step="0.01" />
    <button onclick="send()">Отправить</button>
  </div>

  <script>
    function send() {
      const addr = document.getElementById('addr').value;
      const sum = document.getElementById('sum').value;
      if (addr && sum) {
        alert(`Команда:\nsend ${addr} ${sum}\n\nСкопировано в буфер`);
        navigator.clipboard.writeText(`send ${addr} ${sum}`);
      } else {
        alert("Заполни оба поля");
      }
    }
  </script>
</body>
</html>
