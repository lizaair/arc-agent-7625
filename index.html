<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asil — Agent #7625</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    
    body { margin:0; padding:0; background:#f8f9fc; font-family:'Inter', sans-serif; }
    .container { max-width:1000px; margin:40px auto; padding:0 60px; }
    .header { display:flex; align-items:center; gap:50px; margin-bottom:40px; }
    .creature { width:230px; height:230px; background:url('https://files.catbox.moe/mewziy.png') center/contain no-repeat; filter:drop-shadow(0 25px 45px rgba(107,33,168,0.25)); }
    h1 { font-family:'Space Grotesk', sans-serif; font-size:3.5rem; margin:0; }

    .tabs { display:flex; gap:12px; margin:30px 0; flex-wrap:wrap; }
    .tab { padding:16px 32px; cursor:pointer; border-radius:999px; font-weight:600; background:white; box-shadow:0 4px 15px rgba(0,0,0,0.06); transition:0.3s; }
    .tab.active { background:#6b21a8; color:white; transform:scale(1.05); }

    .card { background:white; border-radius:28px; padding:32px; margin:25px 0; box-shadow:0 10px 35px rgba(0,0,0,0.08); }

    button { padding:18px 36px; background:#6b21a8; color:white; border:none; border-radius:999px; font-weight:600; cursor:pointer; transition:0.3s; }
    button:hover { background:#7c3aed; transform:translateY(-4px); }

    input { padding:18px 22px; margin:12px 0; border:1px solid #ddd; border-radius:18px; width:100%; font-size:1.05rem; }

    .message { margin:12px 0; padding:16px 22px; border-radius:20px; max-width:85%; }
    .user { background:#6b21a8; color:white; margin-left:auto; }
    .asil { background:#f1f1f1; margin-right:auto; }
    .history-item { padding:18px; background:#f8f9fa; border-radius:18px; margin:10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="creature"></div>
      <div>
        <div class="tag">Arc Testnet</div>
        <h1>Asil</h1>
        <p style="font-size:1.4rem; opacity:0.9;">Autonomous AI Agent #7625</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">🧠 BTC Price</div>
      <div class="tab" onclick="switchTab(1)">💬 Chat</div>
      <div class="tab" onclick="switchTab(2)">💸 Send USDC</div>
      <div class="tab" onclick="switchTab(3)">🚰 Faucet</div>
    </div>

    <!-- BTC Price -->
    <div class="tab-content" id="tab0">
      <button onclick="makePrediction()">Get BTC Price & Forecast</button>
      <div class="card" id="prediction">Press button to start</div>
      <h3>Prediction History</h3>
      <div class="card" id="predHistory"></div>
    </div>

    <!-- Chat -->
    <div class="tab-content" id="tab1" style="display:none;">
      <div class="card">
        <div id="chat" style="height:420px; overflow-y:auto; padding:20px; background:#f8f9fa; border-radius:20px;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <input type="text" id="userInput" placeholder="Ask Asil anything..." style="flex:1;">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Send USDC -->
    <div class="tab-content" id="tab2" style="display:none;">
      <div class="card">
        <h3>💸 Send USDC</h3>
        <input type="text" id="recipient" placeholder="Recipient Address (0x...)">
        <input type="number" id="amount" step="0.01" placeholder="Amount USDC">
        <button onclick="sendTokens()" style="width:100%; margin-top:20px;">Send USDC</button>
        <div id="sendStatus" style="margin-top:20px; font-weight:500;"></div>
      </div>
      <h3>Send History</h3>
      <div class="card" id="sendHistory"></div>
    </div>

    <!-- Faucet -->
    <div class="tab-content" id="tab3" style="display:none;">
      <div class="card">
        <button onclick="window.open('https://faucet.circle.com/', '_blank')" style="width:100%;">🚰 Get Test USDC</button>
      </div>
    </div>
  </div>

  <script>
    let predictions = JSON.parse(localStorage.getItem('pred')) || [];
    let sends = JSON.parse(localStorage.getItem('sends')) || [];

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
      document.querySelectorAll('.tab-content').forEach((c,i) => c.style.display = i===n ? 'block' : 'none');
    }

    function renderHistories() {
      document.getElementById('predHistory').innerHTML = predictions.map(p => `<div class="history-item">${p}</div>`).join('') || '<p>No predictions yet</p>';
      document.getElementById('sendHistory').innerHTML = sends.map(s => `<div class="history-item">${s}</div>`).join('') || '<p>No sends yet</p>';
    }

    async function makePrediction() {
      const el = document.getElementById('prediction');
      el.innerHTML = "Asil is thinking...";
      try {
        const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
        const data = await res.json();
        const price = parseFloat(data.price).toLocaleString();
        const change = (Math.random() * 8 - 3.5).toFixed(2);
        const text = `BTC: $${price} | 4h: ${change > 0 ? '+' : ''}${change}%`;
        el.innerHTML = text;
        predictions.unshift(text + " • " + new Date().toLocaleTimeString('en-US'));
        if (predictions.length > 12) predictions.pop();
        localStorage.setItem('pred', JSON.stringify(predictions));
        renderHistories();
      } catch(e) { el.innerHTML = "Failed to load"; }
    }

    function sendTokens() {
      const amount = document.getElementById('amount').value;
      const recipient = document.getElementById('recipient').value;
      const status = document.getElementById('sendStatus');

      if (!amount || !recipient) return status.innerHTML = "Please fill all fields";

      status.innerHTML = "Sending...";
      setTimeout(() => {
        const msg = `✅ Sent ${amount} USDC • ${new Date().toLocaleTimeString('en-US')}`;
        status.innerHTML = msg;
        sends.unshift(msg);
        if (sends.length > 10) sends.pop();
        localStorage.setItem('sends', JSON.stringify(sends));
        renderHistories();
      }, 1300);
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";

      setTimeout(() => {
        let reply = "Got it! What else?";
        if (text.toLowerCase().includes("btc") || text.toLowerCase().includes("price")) reply = "BTC is around $103,400 right now.";
        if (text.toLowerCase().includes("balance")) reply = "Your balance is 59.34 USDC.";
        chat.innerHTML += `<div class="message asil">${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 700);
    }

    window.onload = () => {
      renderHistories();
      document.getElementById('chat').innerHTML = `<div class="message asil">Hello! I'm Asil.<br>Ask me anything about BTC, balance or transactions.</div>`;
    };
  </script>
</body>
</html>
