<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asil — Autonomous AI Agent #7625</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    
    body { margin:0; padding:0; background:#ffffff; color:#1f1f1f; font-family:'Inter', sans-serif; }
    .container { max-width:1000px; margin:0 auto; padding:40px 60px; }
    .header { display:flex; align-items:center; gap:50px; margin-bottom:40px; }
    .creature { width:230px; height:230px; background:url('https://files.catbox.moe/mewziy.png') center/contain no-repeat; filter:drop-shadow(0 20px 35px rgba(0,0,0,0.18)); }
    h1 { font-family:'Space Grotesk', sans-serif; font-size:3.4rem; margin:0; }
    .tag { background:#6b21a8; color:white; padding:6px 18px; border-radius:9999px; font-size:0.95rem; }

    .tabs { display:flex; gap:8px; margin-bottom:30px; flex-wrap:wrap; }
    .tab { padding:12px 24px; cursor:pointer; font-weight:600; border-radius:12px; background:#f1f1f1; }
    .tab.active { background:#6b21a8; color:white; }

    .card { background:#f8f9fa; border-radius:20px; padding:28px; margin:25px 0; }
    button { padding:14px 28px; background:#6b21a8; color:white; border:none; border-radius:9999px; font-weight:600; cursor:pointer; }
    button:hover { background:#7c3aed; }
    input { padding:14px; margin:10px 0; border:1px solid #ddd; border-radius:12px; width:100%; }

    .history { max-height:400px; overflow-y:auto; }
    .history-item { padding:14px; margin:10px 0; background:white; border-radius:12px; border-left:4px solid #6b21a8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="creature"></div>
      <div>
        <div class="tag">Built on Arc Testnet</div>
        <h1>Asil</h1>
        <p style="font-size:1.3rem; opacity:0.9;">Autonomous AI Agent #7625</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">🧠 Prediction</div>
      <div class="tab" onclick="switchTab(1)">💬 Chat</div>
      <div class="tab" onclick="switchTab(2)">💸 Send USDC</div>
      <div class="tab" onclick="switchTab(3)">🚰 Faucet</div>
    </div>

    <!-- Prediction Tab -->
    <div class="tab-content" id="tab0">
      <button onclick="makePrediction()" style="margin-bottom:15px;">Make BTC Prediction</button>
      <div class="card" id="prediction">Click the button to get prediction</div>
      <h3>Prediction History</h3>
      <div class="card history" id="predHistory"></div>
    </div>

    <!-- Chat Tab -->
    <div class="tab-content" id="tab1" style="display:none;">
      <div class="card" style="min-height:300px;">Chat with Asil (coming soon)</div>
    </div>

    <!-- Send USDC Tab -->
    <div class="tab-content" id="tab2" style="display:none;">
      <div class="card">
        <h3>Send USDC</h3>
        <input type="text" id="recipient" placeholder="Recipient 0x address" />
        <input type="number" id="amount" step="0.01" placeholder="Amount USDC" />
        <button onclick="sendTokens()" style="width:100%; margin-top:10px;">Send Transaction</button>
        <div id="sendStatus"></div>
      </div>
      <h3>Send History</h3>
      <div class="card history" id="sendHistory"></div>
    </div>

    <!-- Faucet Tab -->
    <div class="tab-content" id="tab3" style="display:none;">
      <div class="card">
        <h3>Get Test Tokens</h3>
        <p>Click the button below to open Circle Faucet</p>
        <button onclick="window.open('https://faucet.circle.com/','_blank')" style="background:#10b981;">Open Faucet</button>
      </div>
    </div>
  </div>

  <script>
    let predictions = JSON.parse(localStorage.getItem('predictions')) || [ ];

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
      document.querySelectorAll('.tab-content').forEach((c,i) => c.style.display = i===n ? 'block' : 'none');
    }

    function renderPredHistory() {
      const el = document.getElementById('predHistory');
      el.innerHTML = predictions.length === 0 ? '<p>No predictions yet.</p>' : 
        predictions.map(p => `<div class="history-item">${p.time} — BTC $${p.price} <strong>${p.rec}</strong></div>`).join('');
    }

    function renderSendHistory() {
      const el = document.getElementById('sendHistory');
      el.innerHTML = transactions.length === 0 ? '<p>No transactions yet.</p>' : 
        transactions.map(t => `<div class="history-item">${t.time} — Sent ${t.amount} USDC</div>`).join('');
    }

    async function makePrediction() {
      const box = document.getElementById('prediction');
      box.innerHTML = "Asil is thinking...";

      const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
      const data = await res.json();
      const price = parseFloat(data.price).toFixed(0);
      const change = (Math.random()*7 - 3).toFixed(2);
      const rec = change > 2 ? "🟢 STRONG BUY" : change > 0 ? "🟢 BUY" : "🔴 HOLD";

      box.innerHTML = `BTC Price: $${price}<br>Forecast: ${change}% <br>Recommendation: <strong>${rec}</strong>`;

      predictions.unshift({time: new Date().toLocaleTimeString(), price, rec});
      if (predictions.length > 12) predictions.pop();
      localStorage.setItem('predictions', JSON.stringify(predictions));
      renderPredHistory();
    }

    async function sendTokens() {
      const recipient = document.getElementById('recipient').value;
      const amount = document.getElementById('amount').value;
      const status = document.getElementById('sendStatus');

      if (!recipient || !amount) return status.innerHTML = "Please fill all fields";

      status.innerHTML = `Sending ${amount} USDC...`;

      setTimeout(() => {
        status.innerHTML = `<span style="color:green;">✅ Sent ${amount} USDC successfully!</span>`;
        
        transactions.unshift({time: new Date().toLocaleTimeString(), amount});
        if (transactions.length > 10) transactions.pop();
        localStorage.setItem('transactions', JSON.stringify(transactions));
        renderSendHistory();
      }, 1200);
    }

    // Init
    renderPredHistory();
    renderSendHistory();
  </script>
</body>
</html>
