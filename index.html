<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asil — Agent #7625</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { margin:0; padding:0; background:#ffffff; font-family:'Inter', sans-serif; }
    .container { max-width:1000px; margin:40px auto; padding:0 60px; }
    .header { display:flex; align-items:center; gap:50px; margin-bottom:30px; }
    .creature { width:220px; height:220px; background:url('https://files.catbox.moe/mewziy.png') center/contain no-repeat; }
    h1 { font-family:'Space Grotesk', sans-serif; font-size:3.3rem; }

    .tabs { display:flex; gap:10px; margin:30px 0; flex-wrap:wrap; }
    .tab { padding:14px 26px; cursor:pointer; border-radius:12px; font-weight:600; background:#f1f1f1; }
    .tab.active { background:#6b21a8; color:white; }

    .card { background:#f8f9fa; border-radius:20px; padding:25px; margin:20px 0; }
    .message { margin:12px 0; padding:14px 18px; border-radius:18px; max-width:80%; }
    .user { background:#6b21a8; color:white; margin-left:auto; }
    .asil { background:#f1f1f1; margin-right:auto; }
    .history-item { padding:14px; background:white; border-radius:12px; margin:8px 0; border-left:4px solid #6b21a8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="creature"></div>
      <div>
        <div class="tag">Built on Arc Testnet</div>
        <h1>Asil</h1>
        <p>Autonomous AI Agent #7625</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">🧠 Prediction</div>
      <div class="tab" onclick="switchTab(1)">💬 Chat</div>
      <div class="tab" onclick="switchTab(2)">💸 Send USDC</div>
      <div class="tab" onclick="switchTab(3)">🚰 Faucet</div>
    </div>

    <!-- Prediction -->
    <div class="tab-content" id="tab0">
      <button onclick="makePrediction()">Get BTC Prediction</button>
      <div class="card" id="prediction">Click button to start</div>
      <h3>Prediction History</h3>
      <div class="card" id="predHistory"></div>
    </div>

    <!-- Chat -->
    <div class="tab-content" id="tab1" style="display:none;">
      <div class="card">
        <div id="chat" style="height:420px; overflow-y:auto; padding:15px; background:white; border-radius:16px;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <input type="text" id="userInput" placeholder="Ask Asil anything..." style="flex:1; padding:16px; border-radius:999px; border:1px solid #ddd;">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Send USDC -->
    <div class="tab-content" id="tab2" style="display:none;">
      <div class="card">
        <h3>Send USDC</h3>
        <input type="text" id="recipient" placeholder="0x... Recipient Address">
        <input type="number" id="amount" step="0.01" placeholder="Amount">
        <button onclick="sendTokens()" style="width:100%; margin-top:15px; background:#10b981;">Send USDC</button>
        <div id="sendStatus"></div>
      </div>
      <h3>Send History</h3>
      <div class="card" id="sendHistory"></div>
    </div>

    <!-- Faucet -->
    <div class="tab-content" id="tab3" style="display:none;">
      <div class="card">
        <button onclick="window.open('https://faucet.circle.com/', '_blank')" style="width:100%;">🚰 Open Circle Faucet</button>
      </div>
    </div>
  </div>

  <script>
    let predictions = JSON.parse(localStorage.getItem('pred')) || [];
    let transactions = JSON.parse(localStorage.getItem('tx')) || [];

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
      document.querySelectorAll('.tab-content').forEach((c,i) => c.style.display = i===n ? 'block' : 'none');
    }

    function renderHistories() {
      document.getElementById('predHistory').innerHTML = predictions.map(p => 
        `<div class="history-item">${p}</div>`).join('') || '<p>No predictions yet</p>';

      document.getElementById('sendHistory').innerHTML = transactions.map(t => 
        `<div class="history-item">${t}</div>`).join('') || '<p>No sends yet</p>';
    }

    async function makePrediction() {
      const el = document.getElementById('prediction');
      el.innerHTML = "Loading...";
      try {
        const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
        const data = await res.json();
        const price = parseFloat(data.price).toLocaleString();
        const change = (Math.random()*8 - 3.5).toFixed(2);
        const rec = change > 1 ? "STRONG BUY" : "HOLD";
        const text = `BTC $${price} | ${change}% → ${rec}`;
        el.innerHTML = text;
        predictions.unshift(text + " • " + new Date().toLocaleTimeString());
        if (predictions.length > 10) predictions.pop();
        localStorage.setItem('pred', JSON.stringify(predictions));
        renderHistories();
      } catch(e) { el.innerHTML = "Error"; }
    }

    function sendTokens() {
      const amount = document.getElementById('amount').value;
      const recipient = document.getElementById('recipient').value;
      const status = document.getElementById('sendStatus');

      if (!amount || !recipient) return status.innerHTML = "Fill all fields";

      status.innerHTML = "Sending...";
      setTimeout(() => {
        const msg = `Sent ${amount} USDC • ${new Date().toLocaleTimeString()}`;
        status.innerHTML = `<span style="color:green;">✅ ${msg}</span>`;
        transactions.unshift(msg);
        if (transactions.length > 10) transactions.pop();
        localStorage.setItem('tx', JSON.stringify(transactions));
        renderHistories();
      }, 1200);
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="message user">${text}</div>`;

      input.value = "";

      setTimeout(() => {
        let reply = "Understood!";
        if (text.toLowerCase().includes("btc") || text.toLowerCase().includes("price")) reply = "BTC is around $103k right now.";
        if (text.toLowerCase().includes("balance")) reply = "Balance: 59.34 USDC";
        chat.innerHTML += `<div class="message asil">${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 700);
    }

    window.onload = () => {
      renderHistories();
      document.getElementById('chat').innerHTML = `<div class="message asil">Hello! I'm Asil. How can I help you?</div>`;
    };
  </script>
</body>
</html>
